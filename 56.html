<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">

<title>Live Stream</title>

<script src="//content.jwplatform.com/libraries/SAHhwvZq.js"></script>

    
<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* FULLSCREEN PLAYER */
#player-frame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;

    /* ADDRESS BAR HEIGHT FIX */
    height: 100dvh;

    border: none;
    background: #000;
}

/* MOBILE FIX */
@supports not (height: 100dvh) {
    #player-frame {
        height: 100vh;
    }
}
</style>

<iframe
    id="player-frame"
    src="https://crickld2026.netlify.app/aioplayer?id=1108"
    allow="autoplay; fullscreen"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen>
</iframe>

<script>
/* EXTRA MOBILE FULL HEIGHT FIX */
function setFullHeight() {

    document.documentElement.style.height =
    window.innerHeight + "px";

    document.body.style.height =
    window.innerHeight + "px";

}

setFullHeight();

window.addEventListener(
    "resize",
    setFullHeight
);
</script>
    
</body>
</html>
