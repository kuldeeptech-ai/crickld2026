<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">

<title>Live Stream</title>

<script src="//content.jwplatform.com/libraries/SAHhwvZq.js"></script>

    
<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* REAL FULLSCREEN */
#player-frame {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: 0;
    background: #000;
}
</style>

<iframe
    id="player-frame"
    src="https://crickld2026.netlify.app/aioplayer?id=1108"
    allow="autoplay; fullscreen"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen>
</iframe>

<script>
/* FORCE MOBILE FULLSCREEN HEIGHT */
function fixHeight() {

    let vh =
    window.innerHeight;

    document.body.style.height =
    vh + "px";

    document.documentElement.style.height =
    vh + "px";

    const iframe =
    document.getElementById("player-frame");

    iframe.style.height =
    vh + "px";

}

/* RUN */
fixHeight();

/* ON ROTATE / RESIZE */
window.addEventListener(
    "resize",
    fixHeight
);

window.addEventListener(
    "orientationchange",
    fixHeight
);


/* HIDE PAGE SCROLL */
document.body.style.overflow =
"hidden";
</script>    
</body>
</html>
