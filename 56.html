<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">

<title>Live Stream</title>

<script src="//content.jwplatform.com/libraries/SAHhwvZq.js"></script>

    
<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* REMOVE GAP */
iframe {
    display: block;
}

/* REAL FULLSCREEN */
#player-frame {
    position: fixed;
    top: 0;
    left: 0;

    width: 100vw;

    /* IMPORTANT FIX */
    height: calc(var(--vh, 1vh) * 100);

    border: none;
    background: #000;

    z-index: 999999;
}
</style>

<iframe
    id="player-frame"
    src="https://crickld2026.netlify.app/aioplayer?id=1108"
    allow="autoplay; fullscreen"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen>
</iframe>

<script>
/* MOBILE TRUE HEIGHT FIX */
function setRealHeight() {

    let vh =
    window.innerHeight * 0.01;

    document.documentElement.style.setProperty(
        '--vh',
        `${vh}px`
    );

}

/* RUN */
setRealHeight();

/* UPDATE ON ROTATE */
window.addEventListener(
    'resize',
    setRealHeight
);

window.addEventListener(
    'orientationchange',
    setRealHeight
);


/* PREVENT SCROLL */
document.body.style.overflow =
"hidden";

document.documentElement.style.overflow =
"hidden";
</script>


</body>
</html>
