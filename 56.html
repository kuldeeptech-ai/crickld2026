<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">

<title>Live Stream</title>

<script src="//content.jwplatform.com/libraries/SAHhwvZq.js"></script>
<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

#player {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
}

.jwplayer {
    width: 100% !important;
    height: 100% !important;
}

.jw-aspect {
    display: none !important;
}

iframe {
    width: 100% !important;
    height: 100% !important;
    border: none !important;
}
</style>

<div id="player"></div>

<script src="https://cdn.jwplayer.com/libraries/KB5zFt7A.js"></script>

<script>
jwplayer.key = "YOUR_JWPLAYER_KEY";

const player = jwplayer("player").setup({

    file:
    "https://crickld2026.netlify.app/aioplayer?id=1108",

    width: "100%",

    height: "100%",

    autostart: false,

    controls: true,

    stretching: "fill"

});


/* FORCE FULLSCREEN VIEW */
player.on("ready", function () {

    const container =
    player.getContainer();

    container.style.position =
    "fixed";

    container.style.top =
    "0";

    container.style.left =
    "0";

    container.style.width =
    "100vw";

    container.style.height =
    "100vh";

    container.style.zIndex =
    "999999";

});
</script>
</body>
</html>
