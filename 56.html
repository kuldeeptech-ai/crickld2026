<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">

<title>Live Stream</title>

<script src="//content.jwplatform.com/libraries/SAHhwvZq.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

/* FULL PAGE CENTER */
#main {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 16:9 BOX */
#player-box {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
}

/* Maintain 16:9 */
#player-box::before {
    content: "";
    display: block;
    padding-top: 56.25%;
}

#player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#player {
    width: 100% !important;
    height: 100% !important;
}
</style>

</head>

<body>

<div id="main">
    <div id="player-box">
        <div id="player-container">
            <div id="player"></div>
        </div>
    </div>
</div>
<script>
/* CUSTOM THUMBNAIL */
const DEMO_THUMB =
"https://plain-apac-prod-public.komododecks.com/202605/15/BBmtvaRJgaiPJkb68zIS/image.jpg";

/* CUSTOM CIRCLE LOGO */
const DEMO_LOGO =
"https://plain-apac-prod-public.komododecks.com/202605/15/n37lRAW4k538Hu2b6abv/image.png";


/* PLAYER SOURCE */
player.load([{
    file: "https://crickld2026.netlify.app/aioplayer?id=1108",
    image: DEMO_THUMB
}]);


/* PLAYER READY */
player.on('ready', function () {

    /* CUSTOM LOGO */
    const logo =
    document.createElement("img");

    logo.src = DEMO_LOGO;

    logo.id = "custom-logo";

    logo.style.position = "absolute";
    logo.style.top = "15px";
    logo.style.left = "15px";

    logo.style.width = "80px";
    logo.style.height = "80px";

    logo.style.objectFit = "contain";
    logo.style.borderRadius = "50%";

    logo.style.zIndex = "999999";
    logo.style.pointerEvents = "none";

    player.getContainer().appendChild(logo);

});


/* SHOW THUMBNAIL ON PAUSE */
player.on("pause", function(){

    const container =
    player.getContainer();

    let overlay =
    document.getElementById("pause-thumb");

    if(!overlay){

        overlay =
        document.createElement("div");

        overlay.id =
        "pause-thumb";

        overlay.style.position =
        "absolute";

        overlay.style.top =
        "0";

        overlay.style.left =
        "0";

        overlay.style.width =
        "100%";

        overlay.style.height =
        "100%";

        overlay.style.backgroundImage =
        `url(${DEMO_THUMB})`;

        overlay.style.backgroundPosition =
        "center";

        overlay.style.backgroundRepeat =
        "no-repeat";

        overlay.style.backgroundSize =
        "contain";

        overlay.style.backgroundColor =
        "#000";

        overlay.style.zIndex =
        "1";

        overlay.style.pointerEvents =
        "none";

        container.appendChild(overlay);

    }

    overlay.style.display =
    "block";

});


/* HIDE THUMBNAIL WHEN PLAY */
player.on("play", function(){

    const overlay =
    document.getElementById("pause-thumb");

    if(overlay){

        overlay.style.display =
        "none";

    }

});
</script>
</body>
</html>
