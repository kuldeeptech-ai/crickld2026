<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">

  <title>Result Portal</title>

  <style>
    /* RESET */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;

      overflow: hidden;

      background: #ffffff;
    }

    /* FULL SCREEN FRAME */
    #portal {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      width: 100%;
      height: 100%;

      width: 100dvw;
      height: 100dvh;

      margin: 0;
      padding: 0;
      border: 0;

      display: block;

      background: #ffffff;
    }

    /* MOBILE SAFE AREA */
    @supports (height: 100svh) {
      #portal {
        height: 100svh;
      }
    }

    /* LANDSCAPE / DESKTOP */
    @media (min-width: 768px) {
      #portal {
        width: 100vw;
        height: 100vh;
      }
    }
  </style>
</head>

<body>

  <iframe
    id="portal"
    src="https://script.google.com/macros/s/AKfycby-RpS717pNlFDssN8DY3DjPIwBCEH8Pd8Z5QUblgrQ8rpZy6HLQRAwox_Q_d6iszYfbw/exec"
    frameborder="0"
    scrolling="auto"
    allowfullscreen>
  </iframe>

</body>
</html>
