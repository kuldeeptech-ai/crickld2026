<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* Main Player */
.player-wrap{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* iframe */
.player-wrap iframe{
    position:absolute;

    /* thoda hi zoom */
    top:-1.5%;
    left:-1.5%;

    width:103%;
    height:103%;

    border:none;
    outline:none;

    background:#000;
}

/* Bottom original looking mask */
.player-wrap::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:100%;

    /* smaller height */
    height:58px;

    z-index:99999;
    pointer-events:none;

    /* solid natural black */
    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,.92) 55%,
        rgba(0,0,0,1) 100%
    );
}

/* Edge cleanup */
.player-wrap::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:9999;

    box-shadow:
    inset 0 0 18px rgba(0,0,0,.55),
    inset 0 -18px 25px rgba(0,0,0,.9);
}

/* Fullscreen */
.player-wrap:fullscreen,
.player-wrap:-webkit-full-screen{
    width:100vw;
    height:100vh;
}

/* Mobile */
@media(max-width:768px){

    .player-wrap iframe{

        top:-2%;
        left:-2%;

        width:104%;
        height:104%;
    }

    .player-wrap::after{
        height:62px;
    }
}

</style>
</head>

<body>

<div class="player-wrap" id="player">

<iframe
src="https://widget.jionews.com/jiotv-cricket/prod/v1/index.html?theme=dark&ismobile=true"
allow="autoplay; fullscreen; encrypted-media"
allowfullscreen
webkitallowfullscreen
mozallowfullscreen>
</iframe>

</div>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());

document.onkeydown = function(e) {

  if (
    e.keyCode == 123 ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.ctrlKey && e.key == 'u')
  ) {
    return false;
  }
};
</script>
<script>

const player = document.getElementById("player");

/* Smooth fullscreen */
document.addEventListener("click", async()=>{

    try{

        if(!document.fullscreenElement){

            await player.requestFullscreen();

        }

    }catch(e){}

},{once:true});

/* Disable scroll */
document.addEventListener("touchmove",e=>{
    e.preventDefault();
},{passive:false});

/* Disable right click */
document.addEventListener("contextmenu",e=>{
    e.preventDefault();
});

</script>

</body>
</html>
